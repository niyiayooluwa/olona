name: olona
description: "A starter template for GOxFlutter Projects."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  badges: ^3.1.2
  connectivity_plus: ^7.3.1
  dart_either: ^2.0.0
  dio: ^5.11.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.2.0
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^10.0.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.0.0
  flutter_markdown: ^0.7.3
  freezed_annotation: ^3.1.0
  go_router: ^17.4.0
  google_fonts: ^6.3.2
  google_sign_in: ^6.2.1
  hooks_riverpod: ^3.0.3
  intl: ^0.20.2
  json_annotation: 4.9.0
  riverpod_annotation: ^3.0.3
  shadcn_ui: ^0.53.6
  shared_preferences: ^2.5.5
  timeago: ^3.7.1
  uuid: ^4.6.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  package_info_plus: ^10.2.1
  shorebird_code_push: ^2.0.7
  cached_network_image: ^3.4.1

dev_dependencies:
  build_runner: 2.10.5
  custom_lint: ^0.8.1
  flutter_lints: ">=3.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  freezed: ^3.1.0
  json_serializable: 6.11.2
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
     - assets/svgs/logo/
  #  - assets/drawables/logo/
  #  - assets/drawables/states/
  #  - assets/image/
  #  - assets/legal/

