version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5

  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "develop"
