# ST1000: package should have a package comment
# ST1020: comment on exported function should start with the function's name
# ST1021: comment on exported type should start with the type's name
# ST1022: comment on exported var should start with the var's name
# These four are the closest automated enforcement of the godoc rules
# in go-docs-instructions.md — "all" enables the full SA/ST/U set,
# which includes these plus the rest of staticcheck's usual checks.
checks = ["all"]
