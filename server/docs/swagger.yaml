host: localhost:8080
info:
  contact: {}
  description: Backend for Olona — Auth and User Management
  title: Olona API
  version: "1.0"
paths:
  /auth/check-username:
    get:
      description: Checks if a username is available for registration.
      parameters:
      - description: Username to check
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UsernameCheckEnvelope'
        "400":
          description: missing parameter
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Check username availability
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: |-
        Sends a password reset OTP to the email if it exists. Always
        answers 204, whether or not the address has an account, so the
        endpoint cannot be used to enumerate registered emails.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Request password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a token pair.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenPairEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Login to account
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the provided refresh token.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new token pair.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenPairEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: invalid or expired token
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Refresh token pair
      tags:
      - auth
  /auth/resend-otp:
    post:
      consumes:
      - application/json
      description: Sends a new verification OTP to the user's email.
      parameters:
      - description: Email to resend OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ResendOTPRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "429":
          description: cooldown active
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Resend verification OTP
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets user password using the OTP received via email.
      parameters:
      - description: Reset details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: invalid or expired OTP
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Reset password
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: |-
        Registers a new user and sends an OTP for email verification.
        A duplicate email is NOT reported as an error. The handler
        returns 202 with an identical body to a successful 201 so that
        the endpoint cannot be used to discover which addresses have
        accounts. Clients must treat 202 as "check your inbox" exactly
        as they treat 201 — no error branch exists for that case.
        A taken username is reported honestly as 409: it says nothing
        about any email address, and no account is created when it is
        returned, so masking it would tell the caller a code was sent
        for an account that does not exist.
      parameters:
      - description: Signup details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SignupEnvelope'
        "202":
          description: duplicate email, masked as success
          schema:
            $ref: '#/definitions/handler.SignupEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: registration disabled
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "409":
          description: username already taken
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "429":
          description: too many requests
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Create a new account
      tags:
      - auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verifies the 6-digit code sent to the user's email. Returns a token
        pair upon success.
      parameters:
      - description: Email and OTP code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenPairEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: invalid or expired OTP
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "429":
          description: too many attempts
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      summary: Confirm signup OTP and activate the account
      tags:
      - auth
  /v1/invitations/accept:
    post:
      consumes:
      - application/json
      description: Consumes an invitation token and adds caller to workspace. Caller
        email must match recipient email.
      parameters:
      - description: Invitation token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AcceptInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "403":
          description: email does not match invitation recipient
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: invitation not found or expired
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Accept workspace invitation
      tags:
      - members
  /v1/requests:
    get:
      description: Returns pending governance requests across all child workspaces
        that caller has oversight authority to approve.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PendingInboxEnvelope'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Head Office approval inbox
      tags:
      - requests
  /v1/requests/{id}/approve:
    post:
      description: Approves a pending request and atomically executes the state change.
        Requester cannot approve their own request.
      parameters:
      - description: Request UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageEnvelope'
        "403":
          description: requester cannot approve or lack oversight authority
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: request not found or already decided
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "409":
          description: active children conflict
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Approve a governance request
      tags:
      - requests
  /v1/requests/{id}/cancel:
    post:
      description: Cancels an open request. Only the user who originally created the
        request may cancel it.
      parameters:
      - description: Request UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageEnvelope'
        "403":
          description: only original requester can cancel
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: request not found or already decided
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Cancel a governance request
      tags:
      - requests
  /v1/requests/{id}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a pending request with an optional explanation. Requester
        cannot reject their own request.
      parameters:
      - description: Request UUID
        in: path
        name: id
        required: true
        type: string
      - description: Rejection reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/handler.DecideRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageEnvelope'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: request not found or already decided
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Reject a governance request
      tags:
      - requests
  /v1/users/me:
    delete:
      description: Allows a user to permanently delete their own account.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete profile
      tags:
      - users
    get:
      description: Retrieves the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ProfileEnvelope'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Updates optional fields of the authenticated user's profile.
      parameters:
      - description: Profile details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ProfileEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "409":
          description: username already claimed
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - users
  /v1/users/me/password:
    post:
      consumes:
      - application/json
      description: Allows an authenticated user to update their password.
      parameters:
      - description: Password details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - users
  /v1/workspaces:
    get:
      description: Returns the workspace switcher list containing all workspaces where
        the caller has membership or oversight.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.WorkspaceListEnvelope'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List visible workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      description: |-
        Creates a root organization workspace (if parent_id is omitted) or a child subsidiary workspace.
        When creating a child, the target owner is atomically relocated from the parent.
      parameters:
      - description: Workspace creation parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.WorkspaceRawEnvelope'
        "400":
          description: invalid body or target owner not admin
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "403":
          description: caller lacks create_child capability
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: parent workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "409":
          description: parent owner cannot be relocated
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create root or child workspace
      tags:
      - workspaces
  /v1/workspaces/{id}:
    get:
      description: Retrieves workspace metadata along with caller's effective access
        (tier, origin, and capabilities).
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.WorkspaceEnvelope'
        "403":
          description: no access to workspace
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get workspace details
      tags:
      - workspaces
    patch:
      consumes:
      - application/json
      description: Updates workspace name and/or description. Requires workspace.manage_settings
        capability.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.WorkspaceRawEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "403":
          description: permission denied or workspace suspended
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update workspace settings
      tags:
      - workspaces
  /v1/workspaces/{id}/audit:
    get:
      description: Returns paginated, immutable audit log events for the workspace.
        Requires workspace.view_audit capability.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      - description: Page size (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuditListEnvelope'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get workspace audit logs
      tags:
      - audit
  /v1/workspaces/{id}/invitations:
    get:
      description: Returns active, unaccepted, unrevoked invitations for the workspace.
        Requires workspace.manage_members.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.InvitationListEnvelope'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List outstanding invitations
      tags:
      - members
    post:
      consumes:
      - application/json
      description: Sends an invitation for a user to join with an admin, member, or
        viewer tier. Owner tier cannot be invited.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      - description: Invitation parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.InviteMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.InvitationEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "403":
          description: cannot invite owner or lacking manage_members capability
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Invite user to workspace
      tags:
      - members
  /v1/workspaces/{id}/invitations/{invitationId}:
    delete:
      description: Revokes an active invitation token so it can no longer be used
        to join.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      - description: Invitation UUID
        in: path
        name: invitationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageEnvelope'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: invitation not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Revoke pending invitation
      tags:
      - members
  /v1/workspaces/{id}/members:
    get:
      description: Returns active members of the workspace with user profile details.
        Requires workspace.view capability.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MemberListEnvelope'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List active workspace members
      tags:
      - members
  /v1/workspaces/{id}/members/{userId}:
    delete:
      description: Removes an active member from the workspace, or allows caller to
        voluntarily leave. Sole owner cannot leave.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      - description: Target User UUID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageEnvelope'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: member not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "409":
          description: sole owner cannot leave without transfer
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Remove a member or leave workspace
      tags:
      - members
    patch:
      consumes:
      - application/json
      description: Changes a member's tier and capability set. Cannot demote sole
        owner or promote directly to owner.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      - description: Target User UUID
        in: path
        name: userId
        required: true
        type: string
      - description: New role configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateMemberRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageEnvelope'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: member not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "409":
          description: cannot demote sole owner
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update member role
      tags:
      - members
  /v1/workspaces/{id}/requests:
    get:
      description: Returns all governance requests created for a workspace. Requires
        workspace.view capability.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RequestListEnvelope'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List requests for a workspace
      tags:
      - requests
    post:
      consumes:
      - application/json
      description: Submits a Two-Key Control request (archive, delete, transfer_ownership,
        move). Requires matching request_* capability.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      - description: Request parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateGovernanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.RequestEnvelope'
        "400":
          description: invalid body or target user
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "403":
          description: permission denied
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "409":
          description: active children block action
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Open a governance request
      tags:
      - requests
  /v1/workspaces/{id}/resume:
    post:
      description: Unfreezes a previously suspended child workspace via parent oversight
        authority.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.WorkspaceRawEnvelope'
        "403":
          description: caller lacks oversight authority
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Resume a suspended workspace
      tags:
      - workspaces
  /v1/workspaces/{id}/suspend:
    post:
      description: Immediately freezes a child workspace via parent oversight authority.
        Reversible via resume.
      parameters:
      - description: Workspace UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.WorkspaceRawEnvelope'
        "403":
          description: caller lacks oversight authority
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "404":
          description: workspace not found
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/apiresponse.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Suspend a child workspace
      tags:
      - workspaces
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
