  model.RequestView:
    properties:
      created_at:
        type: string
      decided_at:
        type: string
      decided_by:
        type: string
      expires_at:
        type: string
      id:
        type: string
      new_parent_id:
        type: string
      reason:
        type: string
      requested_by:
        type: string
      sole_approver:
        type: boolean
      status:
        type: string
      target_user_id:
