basePath: /
definitions:
  apiresponse.ErrorBody:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/apiresponse.FieldError'
        type: array
      message:
        type: string
    type: object
  apiresponse.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/apiresponse.ErrorBody'
    type: object
  apiresponse.FieldError:
    properties:
      code:
        type: string
      field:
        type: string
    type: object
  db.Workspace:
    properties:
      archived_at:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      delete_after:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      root_id:
        type: string
      single_principal:
        type: boolean
      status:
        $ref: '#/definitions/db.WorkspaceStatus'
      suspended_at:
        type: string
      suspended_by:
        type: string
      updated_at:
        type: string
    type: object
  db.WorkspaceStatus:
    enum:
    - active
    - suspended
    - archive_requested
    - archived
    - delete_requested
    - pending_deletion
    - deleted
    type: string
    x-enum-varnames:
    - WorkspaceStatusActive
    - WorkspaceStatusSuspended
    - WorkspaceStatusArchiveRequested
    - WorkspaceStatusArchived
    - WorkspaceStatusDeleteRequested
    - WorkspaceStatusPendingDeletion
    - WorkspaceStatusDeleted
  handler.AcceptInvitationRequest:
    properties:
      token:
        type: string
    type: object
  handler.AuditListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/model.AuditLogSummary'
        type: array
    type: object
  handler.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  handler.CreateGovernanceRequest:
    properties:
      new_parent_id:
        type: string
      reason:
        type: string
      target_user_id:
        type: string
      type:
        type: string
    type: object
  handler.CreateWorkspaceRequest:
    properties:
      description:
        type: string
      name:
        type: string
      owner_user_id:
        type: string
      parent_id:
        type: string
    type: object
  handler.DecideRequest:
    properties:
      reason:
        type: string
    type: object
  handler.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  handler.InvitationData:
    properties:
      invitation:
        $ref: '#/definitions/model.InvitationSummary'
      token:
        type: string
    type: object
  handler.InvitationEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.InvitationData'
    type: object
  handler.InvitationListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/model.InvitationSummary'
        type: array
    type: object
  handler.InviteMemberRequest:
    properties:
      capabilities:
        items:
          type: string
        type: array
      email:
        type: string
      tier:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handler.MemberListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/model.MemberSummary'
        type: array
    type: object
  handler.MessageEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.MessageResponse'
    type: object
  handler.MessageResponse:
    properties:
      message:
        type: string
    type: object
  handler.PendingInboxEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/model.PendingRequestSummary'
        type: array
    type: object
  handler.ProfileEnvelope:
    properties:
      data:
        $ref: '#/definitions/model.UserProfile'
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handler.RequestEnvelope:
    properties:
      data:
        $ref: '#/definitions/model.RequestView'
    type: object
  handler.RequestListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/model.WorkspaceRequestSummary'
        type: array
    type: object
  handler.ResendOTPRequest:
    properties:
      email:
        type: string
    type: object
  handler.ResetPasswordRequest:
    properties:
      code:
        type: string
      email:
        type: string
      new_password:
        type: string
    type: object
  handler.SignupData:
    properties:
      tokens:
        $ref: '#/definitions/handler.TokenPairResponse'
      verification_required:
        type: boolean
    type: object
  handler.SignupEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.SignupData'
    type: object
  handler.SignupRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handler.TokenPairEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.TokenPairResponse'
    type: object
  handler.TokenPairResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  handler.UpdateMemberRoleRequest:
    properties:
      capabilities:
        items:
          type: string
        type: array
      tier:
        type: string
    type: object
  handler.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
  handler.UpdateWorkspaceRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  handler.UsernameCheck:
    properties:
      available:
        type: boolean
    type: object
  handler.UsernameCheckEnvelope:
    properties:
      data:
        $ref: '#/definitions/handler.UsernameCheck'
    type: object
  handler.VerifyRequest:
    properties:
      code:
        type: string
      email:
        type: string
    type: object
  handler.WorkspaceEnvelope:
    properties:
      data:
        $ref: '#/definitions/model.WorkspaceDetail'
    type: object
  handler.WorkspaceListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/model.WorkspaceSummary'
        type: array
    type: object
  handler.WorkspaceRawEnvelope:
    properties:
      data:
        $ref: '#/definitions/model.WorkspaceView'
    type: object
  model.AuditLogSummary:
    properties:
      action:
        type: string
      actor_email:
